
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100817">
  <title>DISCO VOICE CHAT | Owner Panel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="crown">♛</div>
    <h1>DISCO VOICE CHAT</h1>
    <p>SUPER ADMIN CONTROL CENTER</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Owner Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="gold-btn" type="submit">SECURE LOGIN</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
</div>

<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">♛</span>
      <div>
        <h2>OWNER PANEL</h2>
        <small>Super Admin • DISCO PRO</small>
      </div>
    </div>

    <input id="menuSearch" class="menu-search" placeholder="⌕  Search menus...">

    <nav id="sidebarMenu">
      <div class="menu-heading">MAIN CONTROL</div>
      <button class="nav-item active" data-page="dashboard">◈ Dashboard</button>
      <button class="nav-item" data-page="analytics">▥ Analytics</button>
      <button class="nav-item" data-page="activity">◷ Activity Log</button>

      <div class="menu-heading">USER MANAGEMENT</div>
      <button class="nav-item" data-page="users">♙ User Management</button>
      <button class="nav-item" data-page="rooms">▣ Live Room Control</button>
      <button class="nav-item" data-page="staff">♜ Admin & Staff</button>
      <button class="nav-item" data-page="agencies">♧ Agencies & BD</button>
      <button class="nav-item" data-page="roles">♛ Roles & Permissions</button>

      <div class="menu-heading">COINS & STORE</div>
      <button class="nav-item" data-page="coins">◉ Coins Management</button>
      <button class="nav-item" data-page="recharge">＋ Recharge Packages</button>
      <button class="nav-item" data-page="wallet">▤ Wallet & Diamonds</button>
      <button class="nav-item" data-page="gifts">♡ Gift Management</button>
      <button class="nav-item" data-page="frames">✧ Frame Store</button>
      <button class="nav-item" data-page="vip">♕ VIP / SVIP Control</button>
      <button class="nav-item" data-page="payouts">⇧ Withdrawals & Payouts</button>
      <button class="nav-item" data-page="commission">％ Commission Rules</button>

      <div class="menu-heading">APP CONTROL</div>
      <button class="nav-item" data-page="app">⚙ App Settings</button>
      <button class="nav-item" data-page="security">⬡ Security Control</button>
      <button class="nav-item" data-page="moderation">⚑ Moderation</button>
      <button class="nav-item" data-page="events">★ Events & Rewards</button>
      <button class="nav-item" data-page="notifications">♢ Notifications</button>
      <button class="nav-item" data-page="broadcasts">➤ Broadcast Messages</button>
      <button class="nav-item" data-page="reports">⚠ Reports</button>
      <button class="nav-item" data-page="integrations">⌘ Integrations</button>
      <button class="nav-item" data-page="backup">▣ Backup & Export</button>
      <button class="nav-item" data-page="settings">⚙ System Settings</button>
    </nav>

    <div class="sidebar-bottom">
      <div class="admin-profile">
        <div class="avatar">♛</div>
        <div>
          <b id="adminEmail">Owner</b>
          <small>● Online</small>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn">⇥ Logout</button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb">Owner Panel / Dashboard</div>
      <div class="top-actions">
        <input id="globalSearch" placeholder="⌕ Search all options...">
        <button id="refreshBtn" class="outline-btn">↻ Refresh</button>
        <button id="emergencyBtn" class="danger-btn">⚡ Emergency Stop</button>
      </div>
    </header>

    <div class="content">
      <div id="connectionStatus" class="connection-status">Connecting to Firebase...</div>
      <div id="pageContent"></div>
    </div>

    <footer class="footer">
      <span id="saveStatus">All changes saved</span>
      <div>
        <button id="discardBtn" class="outline-btn">Discard</button>
        <button id="saveBtn" class="gold-btn">Save All Changes</button>
      </div>
    </footer>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">Control</h3>
      <button id="closeModal">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
